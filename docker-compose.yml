services:
  lar-em-ordem:
    build: .
    container_name: lar-em-ordem
    ports:
      - "3000:3000"
    volumes:
      - lar-em-ordem-data:/data
      - ./index.html:/app/index.html
      - ./styles.css:/app/styles.css
      - ./server.js:/app/server.js
      - ./src:/app/src
    restart: unless-stopped

volumes:
  lar-em-ordem-data:
