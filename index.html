<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lar em Ordem</title><style>
:root{--bg:#f6f7f3;--surface:#fff;--ink:#20251f;--muted:#687167;--line:#e3e7df;--brand:#39694a;--soft:#edf5ed;--danger:#a03a32;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg)}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}.app{min-height:100vh;display:grid;grid-template-columns:230px 1fr}.side{background:var(--surface);border-right:1px solid var(--line);padding:26px 15px}.brand{font-weight:750;font-size:17px;margin:0 10px 28px}.brand b{display:inline-grid;place-items:center;width:31px;height:31px;background:var(--brand);color:#fff;border-radius:10px;margin-right:9px}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;color:var(--muted);padding:10px 12px;text-align:left;border-radius:9px;font-weight:600}.nav button.active,.nav button:hover{color:var(--brand);background:var(--soft)}main{max-width:1170px;width:100%;margin:auto;padding:34px 42px}.top,.toolbar{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:24px}h1{margin:0 0 6px;font-size:27px;letter-spacing:-.04em}h2{font-size:15px;margin:0}.sub{margin:0;color:var(--muted)}.primary,.secondary{border-radius:9px;padding:10px 14px;font-weight:650}.primary{background:var(--brand);color:#fff;border:0}.secondary{background:var(--surface);color:var(--ink);border:1px solid var(--line)}.grid{display:grid;grid-template-columns:1.2fr .9fr;gap:18px}.panel,.card{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:20px;box-shadow:0 10px 28px #2030200c}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.link{background:transparent;border:0;color:var(--brand);font-size:13px;font-weight:650}.row{display:grid;grid-template-columns:66px 1fr auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}.row:first-of-type{border-top:0}.time{color:var(--brand);font-size:13px;font-weight:700}.name{font-size:14px;font-weight:650}.detail{display:block;margin-top:3px;color:var(--muted);font-size:12px}.tag{font-size:11px;color:var(--brand);background:var(--soft);padding:5px 8px;border-radius:20px}.minis,.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:17px;margin-top:18px}.mini{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:17px}.mini i{color:var(--brand);font-style:normal;font-size:18px}.mini h3{font-size:13px;margin:11px 0 5px}.mini p{font-size:12px;line-height:1.45;color:var(--muted);margin:0}.cards{margin-top:0}.card h3{font-size:15px;margin:0 0 12px}.table{border-collapse:collapse;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:15px;overflow:hidden;box-shadow:0 10px 28px #2030200c}.table th,.table td{padding:13px 15px;text-align:left;border-bottom:1px solid var(--line);font-size:13px}.table th{font-size:11px;color:var(--muted);text-transform:uppercase}.table tr:last-child td{border:0}.table td:last-child{text-align:right}.delete{border:0;background:transparent;color:var(--muted)}.delete:hover{color:var(--danger)}.check{display:flex;gap:11px;align-items:center;padding:12px 0;border-top:1px solid var(--line);font-size:14px}.check input{accent-color:var(--brand);width:17px;height:17px}.check.done span{text-decoration:line-through;color:var(--muted)}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.album{height:170px;border-radius:14px;padding:15px;display:flex;align-items:end;background:linear-gradient(135deg,#acc99a,#e5c493);color:#fff;font-weight:700;text-shadow:0 1px 4px #0005}.album:nth-child(2n){background:linear-gradient(135deg,#859fc0,#dfaaa0)}.album small{display:block;font-weight:400}.modal{border:0;border-radius:16px;width:min(540px,calc(100% - 30px));padding:0;box-shadow:0 20px 70px #0004}.modal::backdrop{background:#15221677}.modal form{padding:23px}.form{display:grid;gap:12px;margin-top:17px}.form label{font-size:13px;font-weight:650;display:grid;gap:6px}.form input,.form textarea{padding:10px;border:1px solid var(--line);border-radius:8px;outline-color:var(--brand)}.form textarea{min-height:80px}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.toast{position:fixed;bottom:22px;right:22px;padding:12px 15px;background:var(--ink);color:#fff;border-radius:9px;opacity:0;transform:translateY(8px);transition:.2s}.toast.show{opacity:1;transform:none}.auth{max-width:430px;margin:10vh auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:0 12px 35px #20302012}.auth h1{font-size:25px}.auth .form{margin:20px 0}.empty{padding:38px;text-align:center;color:var(--muted)}@media(max-width:760px){.app{display:block}.side{padding:13px;position:static;border-right:0;border-bottom:1px solid var(--line)}.brand{margin:0 4px 12px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;padding:8px}.side .nav button:nth-child(n+6){display:none}main{padding:25px 17px}.grid,.minis,.cards,.gallery{grid-template-columns:1fr}.top{align-items:flex-start}.table{display:block;overflow:auto}.toolbar{flex-direction:column}}
</style></head><body><div id="auth"></div><div id="app" class="app hidden"><aside class="side"><div class="brand"><b>⌂</b>Lar em Ordem</div><nav class="nav" id="nav"></nav><p class="sub" id="profile" style="margin:35px 10px 0;font-size:12px"></p></aside><main id="main"></main></div><dialog class="modal" id="modal"><form id="form"><h2 id="form-title"></h2><div class="form" id="fields"></div><div class="actions"><button class="secondary" type="button" onclick="modal.close()">Cancelar</button><button class="primary">Salvar</button></div></form></dialog><div class="toast" id="toast"></div><script>
const demo=location.search.includes('demo');let demoId=30;const demoUser={id:1,name:'Marina Almeida',email:'marina@familia.local',color:'#39694a'};const demoDb={documents:[{id:1,title:'CNH — João',document_number:'12345678901',category:'Documento pessoal',due_date:'2026-09-21',stored_name:'cnh-joao.pdf'},{id:2,title:'Seguro do carro',document_number:'AP-34112',category:'Seguro',due_date:'2026-10-15'}],events:[{id:3,title:'Consulta da Lívia',event_date:'2026-09-03',event_time:'09:30',detail:'Pediatria · Dra. Fernanda'}],medications:[{id:4,name:'Vitamina D',person:'Lívia',medication_time:'20:00',detail:'5 gotas'}],birthdays:[{id:5,name:'Vovó Rosa',birthday_date:'1954-09-09',notes:'72 anos'}],recipes:[{id:6,title:'Lasanha da vó',description:'Receita preferida da família.',source_url:'https://exemplo.com/lasanha',ingredients:'Massa\nMolho\nQueijo',instructions:'Monte as camadas e asse por 35 minutos.'}],tasks:[{id:7,title:'Comprar presente da vovó',due_date:'2026-09-07',done:0}],shopping_items:[{id:8,title:'Leite',quantity:'2 caixas',category:'Mercado',purchased:0},{id:9,title:'Bananas',quantity:'1 dúzia',category:'Hortifruti',purchased:1}],albums:[{id:10,title:'Férias na praia',album_date:'2026-08-22'},{id:11,title:'Aniversário da Lívia',album_date:'2026-07-16'}],profiles:[demoUser,{id:2,name:'João Almeida',email:'joao@familia.local',color:'#6e8bb9'}]};async function demoApi(url,opt={}){let method=opt.method||'GET',p=url.split('/'),table=p[0],id=Number(p[1]);if(url==='setup-status')return{ready:true};if(url==='me'||url==='login'||url==='setup')return demoUser;if(url==='recipes/import')return{title:'Bolo de cenoura',description:'Importado para demonstração; revise os dados antes de salvar.',source_url:'https://exemplo.com/bolo',ingredients:'Cenoura\nFarinha\nAçúcar',instructions:'Misture os ingredientes e asse.'};if(url==='logout')return null;let rows=demoDb[table];if(!rows)return[];if(method==='GET')return rows;if(method==='DELETE'){let i=rows.findIndex(x=>x.id===id);if(i>=0)rows.splice(i,1);return null}let body=opt.body instanceof FormData?Object.fromEntries(opt.body):JSON.parse(opt.body||'{}');if(method==='PATCH'){let x=rows.find(x=>x.id===id);Object.assign(x,body);return null}if(method==='PUT'){let x=rows.find(x=>x.id===id);Object.assign(x,body);return null}rows.unshift({id:++demoId,...body,done:body.done??0,purchased:body.purchased??0});return{id:demoId}}const $=s=>document.querySelector(s), api=async(url,opt={})=>{if(demo)return demoApi(url,opt);let r=await fetch('/api/'+url,{...opt,headers:{...(opt.body instanceof FormData?{}:{'Content-Type':'application/json'}),...(opt.headers||{})}});if(r.status===204)return null;let d=await r.json();if(!r.ok)throw Error(d.error||'Não foi possível concluir.');return d};let me,view='inicio',store={};const modules=[['inicio','⌂','Início'],['agenda','▣','Agenda'],['documentos','▤','Documentos'],['saude','♥','Saúde'],['aniversarios','✦','Aniversários'],['receitas','♨','Receitas'],['tarefas','✓','Tarefas'],['compras','☷','Compras'],['memorias','▧','Memórias'],['perfis','◉','Perfis']];const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const fmt=d=>d?new Intl.DateTimeFormat('pt-BR',{day:'2-digit',month:'short',year:'numeric'}).format(new Date(d+'T12:00')):'—';function say(m){$('#toast').textContent=m;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),2500)}
async function load(){let keys=['documents','events','medications','birthdays','recipes','tasks','shopping_items','albums','profiles'];let ans=await Promise.all(keys.map(k=>api(k)));keys.forEach((k,i)=>store[k]=ans[i]);render()}function nav(){ $('#nav').innerHTML=modules.map(x=>`<button class="${view===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]} &nbsp;${x[2]}</button>`).join('');$('#profile').textContent=`Conectado como ${me.name}` }function go(v){view=v;render()}const add=(type,label)=>`<button class="primary" onclick="openForm('${type}')">+ ${label}</button>`;function pageHeader(title,sub,action){return `<div class="top"><div><h1>${title}</h1><p class="sub">${sub}</p></div>${action||''}</div>`}function dashboard(){let ev=store.events.slice(0,3),docs=store.documents.slice(0,3);return pageHeader('Bom dia, '+esc(me.name.split(' ')[0]),'Tudo importante para sua família, em um lugar.',add('event','Adicionar'))+`<div class="grid"><section class="panel"><div class="head"><h2>Agenda</h2><button class="link" onclick="go('agenda')">Ver agenda</button></div>${ev.map(x=>row(x.event_time,x.title,x.detail)).join('')||empty('Sem compromissos cadastrados.')}</section><section class="panel"><div class="head"><h2>Documentos</h2><button class="link" onclick="go('documentos')">Ver documentos</button></div>${docs.map(x=>row('▤',x.title,(x.document_number?'Nº '+x.document_number+' · ':'')+fmt(x.due_date))).join('')||empty('Sem documentos cadastrados.')}</section></div><div class="minis"><section class="mini"><i>♥</i><h3>Medicações</h3><p>${store.medications.length} registradas para a família.</p></section><section class="mini"><i>✦</i><h3>Aniversários</h3><p>${store.birthdays.length} datas especiais registradas.</p></section><section class="mini"><i>☷</i><h3>Compras</h3><p>${store.shopping_items.filter(x=>!x.purchased).length} itens pendentes.</p></section></div>`}function row(a,b,c){return `<div class="row"><span class="time">${esc(a||'—')}</span><div><span class="name">${esc(b)}</span><span class="detail">${esc(c||'')}</span></div><span class="tag">Ver</span></div>`}function empty(t){return `<div class="empty">${t}</div>`}
function table(type,heads,cells){let rows=store[type];return `<table class="table"><thead><tr>${heads.map(x=>'<th>'+x+'</th>').join('')}<th></th></tr></thead><tbody>${rows.length?rows.map(x=>`<tr>${cells.map(f=>'<td>'+f(x)+'</td>').join('')}<td><button class="delete" onclick="del('${type}',${x.id})">Excluir</button></td></tr>`).join(''):`<tr><td class="empty" colspan="${heads.length+1}">Ainda não há itens.</td></tr>`}</tbody></table>`}function pageDocuments(){return pageHeader('Documentos','Guarde número, validade e o arquivo de cada documento.',add('document','Enviar documento'))+table('documents',['Documento','Número','Validade','Arquivo'],[x=>'<b>'+esc(x.title)+'</b><span class="detail">'+esc(x.category)+'</span>',x=>esc(x.document_number||'—'),x=>fmt(x.due_date),x=>x.stored_name?(demo?'<span class="tag">Arquivo demo</span>':`<a class="link" href="/api/documents/${x.id}/file">Baixar</a>`):'—'])}function pageAgenda(){return pageHeader('Agenda','Consultas, compromissos e celebrações.',add('event','Novo evento'))+table('events',['Data','Hora','Compromisso'],[x=>fmt(x.event_date),x=>esc(x.event_time||'—'),x=>'<b>'+esc(x.title)+'</b><span class="detail">'+esc(x.detail)+'</span>'])}function pageHealth(){return pageHeader('Saúde','Medicações e informações importantes.',add('medication','Registrar'))+`<div class="cards"><section class="card"><h3>Medicações</h3>${store.medications.map(x=>row(x.medication_time,x.name,(x.person||'Família')+' · '+(x.detail||''))).join('')||empty('Nenhuma medicação registrada.')}</section></div>`}function pageBirthdays(){return pageHeader('Aniversários','Datas especiais de quem faz parte da família.',add('birthday','Novo aniversário'))+table('birthdays',['Nome','Data','Observações'],[x=>'<b>'+esc(x.name)+'</b>',x=>fmt(x.birthday_date),x=>esc(x.notes||'—')])}function pageRecipes(){return pageHeader('Receitas','Cadastre uma receita ou importe de um site compatível.',`<div style="display:flex;gap:8px"><button class="secondary" onclick="importRecipe()">Importar link</button>${add('recipe','Nova receita')}</div>`)+`<div class="cards">${store.recipes.map(x=>`<section class="card"><span class="tag">Receita</span><h3>${esc(x.title)}</h3><p>${esc(x.description||'Sem descrição.')}</p><p style="margin-top:12px"><button class="link" onclick="showRecipe(${x.id})">Abrir e editar</button> · <button class="delete" onclick="del('recipes',${x.id})">Excluir</button></p></section>`).join('')||empty('Nenhuma receita cadastrada.')}</div>`}function pageTasks(){return pageHeader('Tarefas','Responsabilidades compartilhadas.',add('task','Nova tarefa'))+`<section class="panel">${store.tasks.map(x=>`<label class="check ${x.done?'done':''}"><input type="checkbox" ${x.done?'checked':''} onchange="toggle('tasks',${x.id},this.checked)"><span>${esc(x.title)} <small class="detail">Prazo: ${fmt(x.due_date)}</small></span><button class="delete" type="button" onclick="del('tasks',${x.id})">Excluir</button></label>`).join('')||empty('Tudo concluído.')}</section>`}function pageShopping(){return pageHeader('Lista de compras','Itens compartilhados para a próxima compra.',add('shopping_item','Adicionar item'))+`<section class="panel">${store.shopping_items.map(x=>`<label class="check ${x.purchased?'done':''}"><input type="checkbox" ${x.purchased?'checked':''} onchange="toggle('shopping_items',${x.id},this.checked)"><span>${esc(x.title)} <small class="detail">${esc(x.quantity||'')} ${x.category?'· '+esc(x.category):''}</small></span><button class="delete" type="button" onclick="del('shopping_items',${x.id})">Excluir</button></label>`).join('')||empty('Lista vazia.')}</section>`}function pageAlbums(){return pageHeader('Memórias','Álbuns e momentos da família.',add('album','Novo álbum'))+`<div class="gallery">${store.albums.map(x=>`<div class="album">${esc(x.title)}<small>${fmt(x.album_date)}</small></div>`).join('')||empty('Nenhum álbum criado.')}</div>`}function pageProfiles(){return pageHeader('Perfis','Cada pessoa possui sua própria conta e senha.',add('profile','Novo perfil'))+`<div class="cards">${store.profiles.map(x=>`<section class="card"><span class="tag">Perfil</span><h3>${esc(x.name)}</h3><p>${esc(x.email)}</p></section>`).join('')}</div>`}function render(){nav();let pages={inicio:dashboard,agenda:pageAgenda,documentos:pageDocuments,saude:pageHealth,aniversarios:pageBirthdays,receitas:pageRecipes,tarefas:pageTasks,compras:pageShopping,memorias:pageAlbums,perfis:pageProfiles};$('#main').innerHTML=pages[view]()} 
const schemas={event:[['title','Compromisso','text'],['event_date','Data','date'],['event_time','Hora','time'],['detail','Detalhes','text']],document:[['title','Nome do documento','text'],['document_number','Número do documento','text'],['category','Categoria','text'],['due_date','Data de vencimento','date'],['file','Arquivo (até 25 MB)','file']],medication:[['name','Medicação','text'],['person','Para quem?','text'],['medication_time','Horário','time'],['detail','Dosagem / observação','text']],birthday:[['name','Nome','text'],['birthday_date','Data de nascimento','date'],['notes','Observações','text']],recipe:[['title','Nome da receita','text'],['description','Descrição','text'],['source_url','Link de origem','url'],['ingredients','Ingredientes (um por linha)','textarea'],['instructions','Modo de preparo','textarea']],task:[['title','Tarefa','text'],['due_date','Prazo','date']],shopping_item:[['title','Item','text'],['quantity','Quantidade','text'],['category','Categoria','text']],album:[['title','Nome do álbum','text'],['album_date','Data','date']],profile:[['name','Nome','text'],['email','E-mail','email'],['password','Senha (mínimo 8 caracteres)','password'],['color','Cor do perfil','color']]};let modalType,editingId=null;function openForm(type,initial={}){modalType=type;editingId=initial.id||null;$('#form-title').textContent=type==='recipe'?(editingId?'Editar receita':'Cadastrar receita'):'Adicionar';$('#fields').innerHTML=schemas[type].map(([n,l,t])=>`<label>${l}<${t==='textarea'?'textarea':'input'} name="${n}" type="${t==='textarea'?'':t}" ${n==='title'||n==='name'?'required':''}>${t==='textarea'?esc(initial[n]||'')+'</textarea>':''}</label>`).join('');for(let [n] of schemas[type]){let e=$(`[name="${n}"]`);if(e&&initial[n]&&n!=='file')e.value=initial[n]}$('#modal').showModal()}$('#form').onsubmit=async e=>{e.preventDefault();try{let endpoint=modalType==='shopping_item'?'shopping_items':modalType+'s',body=modalType==='document'?new FormData(e.target):JSON.stringify(Object.fromEntries(new FormData(e.target)));await api(editingId?`${endpoint}/${editingId}`:endpoint,{method:editingId?'PUT':'POST',body});$('#modal').close();await load();say('Salvo com sucesso.')}catch(e){say(e.message)}};async function del(type,id){if(!confirm('Excluir este item?'))return;try{await api(`${type}/${id}`,{method:'DELETE'});await load();say('Item removido.')}catch(e){say(e.message)}}async function toggle(type,id,value){try{await api(`${type}/${id}`,{method:'PATCH',body:JSON.stringify(type==='tasks'?{done:value}:{purchased:value})});await load()}catch(e){say(e.message)}}async function importRecipe(){let url=prompt('Cole o link HTTPS da receita:');if(!url)return;try{let recipe=await api('recipes/import',{method:'POST',body:JSON.stringify({url})});openForm('recipe',recipe);say('Dados encontrados. Revise e salve.')}catch(e){say(e.message)}}function showRecipe(id){let r=store.recipes.find(x=>x.id===id);openForm('recipe',r)}
async function auth(){let ready=await api('setup-status');$('#auth').innerHTML=`<section class="auth"><div class="brand"><b>⌂</b>Lar em Ordem</div><h1>${ready.ready?'Entrar':'Criar a família'}</h1><p class="sub">${ready.ready?'Use seu perfil para acessar os dados da família.':'A primeira conta será o perfil administrador.'}</p><form class="form" id="auth-form"><label>Nome${ready.ready?'':'<input name="name" required>'}</label><label>E-mail<input name="email" type="email" required></label><label>Senha<input name="password" type="password" minlength="8" required></label><button class="primary">${ready.ready?'Entrar':'Criar conta'}</button></form></section>`;$('#auth-form').onsubmit=async e=>{e.preventDefault();try{me=await api(ready.ready?'login':'setup',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});$('#auth').classList.add('hidden');$('#app').classList.remove('hidden');await load()}catch(e){say(e.message)}}}async function start(){try{me=await api('me');$('#auth').classList.add('hidden');$('#app').classList.remove('hidden');await load()}catch{auth()}}start();
</script></body></html>
